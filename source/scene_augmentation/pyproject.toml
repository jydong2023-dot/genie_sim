[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene_augmentation"
dynamic = ["version"]
description = "Standalone deterministic augmentation for GenieSim-compatible scene bundles"
requires-python = ">=3.10,<3.13"
license = {text = "MPL-2.0"}
authors = [{ name = "Genie Sim Team" }]
dependencies = ["pillow"]

[project.scripts]
scene-augmentation = "scene_augmentation.cli:main"

[project.urls]
Homepage = "https://github.com/AgibotTech/genie_sim"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"scene_augmentation" = ["profiles/*.json"]
